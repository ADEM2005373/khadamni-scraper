name: Tunisian Job Portals Daily Crawler

on:
  schedule:
    # Runs every day at 06:00 UTC (07:00 Tunisia Time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard anytime

jobs:
  scrape-and-sync:
    name: Crawl & Sync to MongoDB Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Libraries
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Multi-Portal Scraping Sequence
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          SCRAPER_HEADLESS: "true"
          CI: "true"
        run: npx tsx scripts/run-scraper.ts
